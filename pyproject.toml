[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "slurmic"
dynamic = ["version"]
description = "slurmic is a package designed to provide seamless Python function execution on Slurm."
authors = [{ name = "Junhao Liu", email = "junhaoliu17@gmail.com" }]
license = { file = "LICENSE" }
readme = "readme.md"
classifiers = ["License :: OSI Approved :: MIT License"]
keywords = ["deep learning", "neural network", "research"]
requires-python = ">=3.10"
dependencies = ["tyro", "submitit>=1.5.4"]

[dependency-groups]
dev = [
    "ruff",
    "pytest>=8.4.2",
    "accelerate",
    "torch>=2.2.0",
    "sphinx",
    "furo",
    "myst-parser",
    "sphinx-autodoc-typehints",
    "sphinx-copybutton",
    "sphinx-autobuild>=2024.10.3",
    "sphinx-design>=0.6.1",
    "build>=1.3.0",
    "twine>=6.2.0",
]

[project.urls]
Homepage = "https://github.com/jhliu17/slurmic"

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
torchvision = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.setuptools.packages.find]
where = ["."]
include = ["slurmic*"]
exclude = ["docs", "tests"]

[tool.setuptools.package-data]
"*" = ["!*.pyi"]

[tool.setuptools.dynamic]
version = { attr = "slurmic.version.VERSION" }

[tool.ruff]
# Specify the Python version you're targeting
target-version = "py312"

# Set the maximum line length
line-length = 100

# Enable auto-fixing for specific rule categories
fix = true

# Directories to include/exclude
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
    "*.ipynb",        # Exclude notebooks from ruff checks
    "buildkit",
    "docs",
]

[tool.ruff.lint]
ignore = ["F405", "F403", "E741", "E712"]
